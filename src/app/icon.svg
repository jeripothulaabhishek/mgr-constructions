<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C1E" />
      <stop offset="100%" stop-color="#0B0C0E" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="30%" stop-color="#C9A227" />
      <stop offset="70%" stop-color="#B0891E" />
      <stop offset="100%" stop-color="#E2C364" />
    </linearGradient>

    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#C9A227" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#gold-grad)" stroke-width="4" stroke-opacity="0.4" />

  <g filter="url(#gold-glow)">
    <rect x="140" y="120" width="48" height="272" rx="10" fill="url(#gold-grad)" />
    <path d="M 188 120 L 290 120 C 350 120, 370 160, 370 200 C 370 240, 350 280, 290 280 L 188 280 Z" fill="none" stroke="url(#gold-grad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="220" y1="200" x2="310" y2="200" stroke="#0B0C0E" stroke-width="16" stroke-linecap="round" />
    <rect x="110" y="372" width="292" height="20" rx="8" fill="url(#gold-grad)" />
  </g>
</svg>
